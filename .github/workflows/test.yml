name: Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths-ignore:
      - '**/LICENSE'
      - '**/*.md'

env:
  BASE_REF: ${{ github.base_ref || 'main' }}
  HEAD_REF: ${{ github.head_ref || github.ref }}

jobs:
  codecheck:
    name: Run code check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check script
        run: pnpm check

  test:
    name: Test with TypeScript ${{ matrix.typescript }} on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    needs: [codecheck]
    strategy:
      matrix:
        node: ['20.x', '22.x']
        typescript: ['4.7.4', 'latest']
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install specific TypeScript version
        run: pnpm add --save-dev typescript@${{ matrix.typescript }} --lockfile=false

      - name: Run test script
        run: pnpm test

  test-result:
    name: Test result
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ always() }}
    steps:
      - name: Check test status
        run: |
          if [ ${{ needs.test.result }} == 'success' ]; then
            echo 'All tests passed!'
            exit 0
          else
            echo 'Some tests failed.'
            exit 1
          fi
