name: Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths-ignore:
      - '**/LICENSE'
      - '**/*.md'

env:
  BASE_REF: ${{ github.base_ref || 'main' }}
  HEAD_REF: ${{ github.head_ref || github.ref }}

jobs:
  codecheck:
    name: Run code check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check script
        run: pnpm check

      - name: Check published package types
        run: pnpm check:package

  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    needs: [codecheck]
    strategy:
      matrix:
        node: ['22.x', '24.x']
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test script
        run: pnpm test

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: [codecheck]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: ${{ !env.ACT }}
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser E2E tests
        run: pnpm test:e2e

  wasm:
    name: Rebuild WASM from source
    runs-on: ubuntu-latest
    needs: [codecheck]
    if: ${{ github.actor != 'nektos/act' }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the WASM toolchain image
        run: docker build --platform linux/amd64 -t woff2-encoder .

      - name: Rebuild the WASM modules
        run: docker run --platform linux/amd64 --rm -v "$PWD":/src/woff2-encoder -u "$(id -u):$(id -g)" woff2-encoder make -C /src/woff2-encoder

      - name: Report drift between committed and rebuilt artifacts
        run: git status --short build/ && git diff --stat build/

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests against the rebuilt WASM modules
        run: pnpm vitest run

  pack:
    name: Packed tarball smoke test
    runs-on: ubuntu-latest
    needs: [codecheck]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack the publishable tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install the tarball into a clean project and run the exports test
        run: |
          SMOKE="$RUNNER_TEMP/smoke"
          mkdir -p "$SMOKE/tests/e2e"
          cp -r tests/fixtures "$SMOKE/tests/fixtures"
          cp tests/e2e/package-exports.mjs "$SMOKE/tests/e2e/"
          cd "$SMOKE"
          npm init -y
          npm install "$RUNNER_TEMP"/woff2-encoder-*.tgz
          node tests/e2e/package-exports.mjs

  test-result:
    name: Test result
    runs-on: ubuntu-latest
    needs: [test, e2e, wasm, pack]
    if: ${{ always() }}
    steps:
      - name: Check test status
        run: |
          for result in '${{ needs.test.result }}' '${{ needs.e2e.result }}' '${{ needs.wasm.result }}' '${{ needs.pack.result }}'; do
            if [ "$result" != 'success' ] && [ "$result" != 'skipped' ]; then
              echo 'Some tests failed.'
              exit 1
            fi
          done
          echo 'All tests passed!'
